# Copy to <config folder>/credentials.yaml on the NAS and restrict it: chmod 600.
# The file must be owned by the container user (DASHBOARD_UID). Never commit the real file.
# Later tiles read their keys per source id, for example:
#
# weather:
#   apiKey: CHANGE_ME
# calendar-family:        # iCloud: published calendar link (webcal:// or https://)
#   url: webcal://pXX-caldav.icloud.com/published/2/CHANGE_ME
# calendar-person-1:      # Google: "secret address in iCal format"
#   url: https://calendar.google.com/calendar/ical/CHANGE_ME/private-CHANGE_ME/basic.ics
# calendar-person-2:
#   url: https://calendar.google.com/calendar/ical/CHANGE_ME/private-CHANGE_ME/basic.ics
#
# The calendar addresses are secrets: anyone who knows one can read that calendar.
# Only calendar.google.com and icloud.com addresses are accepted.
